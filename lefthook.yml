pre-commit:
  parallel: true
  commands:
    typecheck:
      glob: "**/*.{ts,tsx}"
      run: bun run typecheck
      skip:
        - run: test "$SKIP" -eq 1
    lint:
      run: bun run lint
      skip:
        - run: test "$SKIP" -eq 1

pre-push:
  commands:
    test:
      run: bun run test
      skip:
        - run: test "$SKIP" -eq 1
